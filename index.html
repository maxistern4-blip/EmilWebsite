<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keks-Klicker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
:root{--cream:#fff7e8;--ink:#402a1d;--brown:#8b4c27;--gold:#f5b942;--pink:#f6c8b8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 25%,#fffdf7 0,#f6e6cc 72%);color:var(--ink);font-family:Nunito,system-ui,sans-serif;min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:28px 22px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:900;letter-spacing:-1px}.brand span{color:var(--brown)}.reset{border:1px solid #d7bfa1;background:#fff9ef;border-radius:12px;padding:9px 14px;color:#76543c;font:700 13px inherit;cursor:pointer}.hero{text-align:center;padding:45px 0 28px}.eyebrow{text-transform:uppercase;letter-spacing:3px;font-weight:900;color:#b0784a;font-size:12px}.count{font-size:clamp(48px,8vw,82px);line-height:1;font-weight:900;letter-spacing:-4px;margin:10px 0 5px}.rate{font-weight:700;color:#916d4d}.layout{display:grid;grid-template-columns:1fr 340px;gap:30px;align-items:stretch}.play{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:410px;background:#fff9efb8;border:1px solid #efdfc9;border-radius:28px;position:relative;overflow:hidden}.play:before,.play:after{content:'✦';position:absolute;color:#f0d49b;font-size:25px}.play:before{left:13%;top:20%}.play:after{right:14%;bottom:18%}.cookie{width:240px;height:240px;border:0;border-radius:50%;cursor:pointer;background:radial-gradient(circle at 35% 28%,#d9954c,#a85624 70%);box-shadow:inset -12px -15px 0 #86421f,0 18px 30px #8b4c2740;position:relative;transition:transform .08s;touch-action:manipulation}.cookie:hover{transform:scale(1.035)}.cookie:active{transform:scale(.94)}.chip{position:absolute;width:23px;height:18px;border-radius:50%;background:#4b2819;box-shadow:inset 2px 2px 2px #26130e}.c1{left:52px;top:55px;transform:rotate(35deg)}.c2{left:132px;top:42px;transform:rotate(-20deg)}.c3{left:170px;top:105px;transform:rotate(26deg)}.c4{left:85px;top:126px;transform:rotate(-12deg)}.c5{left:137px;top:178px;transform:rotate(40deg)}.c6{left:43px;top:168px;transform:rotate(-30deg)}.hint{margin-top:20px;color:#9a795d;font-size:14px;font-weight:700}.shop{background:#fff9ef;border:1px solid #efdfc9;border-radius:24px;padding:22px}.shophead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.shop h2{margin:0;font-size:21px}.shop small{color:#9a795d;font-weight:700}.item{width:100%;display:flex;align-items:center;gap:13px;text-align:left;background:white;border:1px solid #efdfc9;border-radius:16px;padding:13px;margin:9px 0;color:var(--ink);cursor:pointer;transition:.15s;font-family:inherit}.item:hover:not(:disabled){transform:translateY(-2px);border-color:#d7a964;box-shadow:0 5px 14px #583a1612}.item:disabled{opacity:.48;cursor:not-allowed}.icon{width:43px;height:43px;border-radius:13px;background:#fff0cf;display:grid;place-items:center;font-size:24px;flex:none}.details{flex:1}.name{font-weight:900;font-size:15px}.desc{font-size:12px;color:#9a795d}.cost{font-weight:900;color:#9d5b29;font-size:14px;white-space:nowrap}.footer{text-align:center;color:#aa8c6e;font-size:12px;margin-top:18px}.float{position:absolute;pointer-events:none;font-weight:900;font-size:26px;color:#a64f21;animation:fly .8s ease-out forwards}@keyframes fly{to{transform:translateY(-80px);opacity:0}}@media(max-width:760px){.layout{grid-template-columns:1fr}.play{min-height:350px}.cookie{width:205px;height:205px}.chip{transform:scale(.86)}.hero{padding-top:35px}.shop{padding:18px}}
</style></head>
<body><main class="wrap"><header class="top"><div class="brand">🍪 <span>Keks-Klicker</span></div><button class="reset" id="reset">Neustart</button></header>
<section class="hero"><div class="eyebrow">Die Keksfabrik läuft</div><div class="count" id="count">0</div><div class="rate"><span id="per">0</span> Kekse pro Sekunde</div></section>
<section class="layout"><div class="play" id="play"><button class="cookie" id="cookie" aria-label="Keks backen"><i class="chip c1"></i><i class="chip c2"></i><i class="chip c3"></i><i class="chip c4"></i><i class="chip c5"></i><i class="chip c6"></i></button><div class="hint">Klick auf den Keks, um zu backen</div></div>
<aside class="shop"><div class="shophead"><h2>🎁 Verbesserungen</h2><small id="owned">0 gekauft</small></div><div id="items"></div></aside></section><div class="footer">Dein Fortschritt wird automatisch gespeichert ✨</div></main>
<script>
const upgrades=[{name:'Oma',desc:'Backt 1 Keks pro Sekunde',icon:'👵',base:15,power:1},{name:'Keksfarm',desc:'Backt 6 Kekse pro Sekunde',icon:'🌾',base:100,power:6},{name:'Bäckerei',desc:'Backt 30 Kekse pro Sekunde',icon:'🏠',base:500,power:30},{name:'Fabrik',desc:'Backt 120 Kekse pro Sekunde',icon:'🏭',base:2500,power:120}];
let s;try{s=JSON.parse(localStorage.getItem('keks-save'))}catch{};s=s||{cookies:0,click:1,owned:[0,0,0,0]};
const $=id=>document.getElementById(id), fmt=n=>Math.floor(n).toLocaleString('de-DE');
function cost(i){return Math.floor(upgrades[i].base*Math.pow(1.17,s.owned[i]))}function cps(){return upgrades.reduce((a,u,i)=>a+u.power*s.owned[i],0)}
function save(){localStorage.setItem('keks-save',JSON.stringify(s))}
function render(){ $('count').textContent=fmt(s.cookies);$('per').textContent=fmt(cps());$('owned').textContent=s.owned.reduce((a,b)=>a+b,0)+' gekauft';$('items').innerHTML='';upgrades.forEach((u,i)=>{let c=cost(i),b=document.createElement('button');b.className='item';b.disabled=s.cookies<c;b.innerHTML=`<span class="icon">${u.icon}</span><span class="details"><span class="name">${u.name} <span style="color:#a78664">×${s.owned[i]}</span></span><br><span class="desc">${u.desc}</span></span><span class="cost">🍪 ${fmt(c)}</span>`;b.onclick=()=>{if(s.cookies>=c){s.cookies-=c;s.owned[i]++;render();save()}};$('items').append(b)})}
$('cookie').onclick=e=>{s.cookies+=s.click;const f=document.createElement('span');f.className='float';f.textContent='+'+s.click;let r=$('play').getBoundingClientRect();f.style.left=(e.clientX-r.left)+'px';f.style.top=(e.clientY-r.top)+'px';$('play').append(f);setTimeout(()=>f.remove(),800);render();save()};
$('reset').onclick=()=>{if(confirm('Wirklich ganz von vorne anfangen?')){s={cookies:0,click:1,owned:[0,0,0,0]};save();render()}};
setInterval(()=>{let n=cps();if(n){s.cookies+=n;render();save()}},1000);render();
</script></body></html>
